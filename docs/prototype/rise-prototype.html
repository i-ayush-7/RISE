<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R.I.S.E. Command Center (prototype)</title>
<style>
:root{--bg:#070c18;--p:#0e1729;--p2:#162339;--b:rgba(255,255,255,.09);--t:#eef3ff;--m:#a3b3d1;--c:#ff5a5f;--c2:#ff7a59;--g:#3ddc9f;--a:#fbbf24;--r:#ff6b6b;--rt:rgba(255,107,107,.12);--g1:rgba(70,110,255,.16);--g2:rgba(255,90,95,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9eff8;--p:#fff;--p2:#eef3fb;--b:rgba(15,26,46,.14);--t:#0f1a2e;--m:#44536e;--c:#c9262c;--c2:#d9482e;--g:#0b7f58;--a:#8a5a00;--r:#b42323;--rt:rgba(180,35,35,.08);--g1:rgba(60,100,220,.1);--g2:rgba(255,90,95,.06)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(900px 520px at 8% -8%,var(--g1),transparent 60%),radial-gradient(760px 420px at 100% 0,var(--g2),transparent 55%),var(--bg);background-attachment:fixed}
body.big{font-size:19px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.app{display:grid;grid-template-columns:84px minmax(0,1fr);height:100%}
nav{display:flex;flex-direction:column;gap:4px;padding:14px 8px;background:rgba(10,16,30,.55);border-right:1px solid var(--b)}
nav button{display:grid;justify-items:center;gap:3px;padding:10px 4px;min-height:60px;border:0;border-radius:14px;background:none;color:var(--m);font-size:.72rem;font-weight:600;cursor:pointer}
nav button:hover{background:var(--p2);color:var(--t)}
nav button[aria-current="page"]{background:var(--p2);color:var(--t);box-shadow:inset 3px 0 var(--c)}
.ic{width:24px;height:24px}
main{min-height:0;display:flex;flex-direction:column;padding:12px 22px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25rem;letter-spacing:.08em;margin-right:6px}
.logo svg{width:28px;height:28px;color:var(--c)}
.badge{border:1px solid var(--b);border-radius:10px;padding:4px 10px;font-size:.8rem;font-weight:600;background:var(--p2)}
.badge.sim{border-color:var(--c);color:var(--c)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:6px}
.sp{flex:1}
.stage{flex:1;min-height:0;overflow:auto}
.home{display:grid;gap:16px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);height:100%;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--p);border:1px solid var(--b);border-radius:18px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 40px -28px rgba(0,0,0,.7)}
.col .card,.two .card{margin:0}
.grow{flex:1;min-height:0;display:flex;flex-direction:column}
h2{margin:0 0 12px;font-size:.98rem;font-weight:700}
.muted{color:var(--m)}.note{font-size:.85rem}
.scene{position:relative;flex:none;height:280px;border-radius:22px;overflow:hidden;border:1px solid var(--b);color:#eef3ff;background:#0b1630;box-shadow:0 30px 50px -30px rgba(0,0,0,.8)}
.scene .sc{position:absolute;inset:0;width:100%;height:100%}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,11,24,.92) 0,rgba(6,11,24,.7) 42%,rgba(6,11,24,0) 72%)}
.sct{position:relative;max-width:min(52%,440px);padding:24px 26px}
.sct .kick{margin:0 0 4px;color:#b9c8e6;font-size:.9rem}
.sct h1{margin:0 0 8px;font-size:clamp(1.7rem,2.6vw,2.45rem);line-height:1.08;font-weight:800;letter-spacing:-.03em}
.sct p{margin:0}.sct h1+p{color:#c5d2ec}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:rgba(8,14,28,.74);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.16);font-size:.78rem;font-weight:600;white-space:nowrap}
.pa{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid #7d8db0;font-size:.7rem;font-weight:800;background:#16233b}
.pa.safe,.av.safe{border-color:var(--g)}.pa.needs,.av.needs{border-color:var(--r)}.pa.pending,.pa.noresp,.av.pending,.av.noresp{border-color:var(--a)}
.msgs{flex:1;min-height:90px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.msg{max-width:90%;padding:10px 14px;border-radius:14px 14px 14px 4px;background:var(--p2)}
.msg.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{min-height:40px;border-radius:12px;border:1px solid var(--b);background:var(--p2);padding:6px 14px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--m)}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--b);background:transparent;padding:8px 16px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--p2)}
.btn.pri{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-color:transparent;box-shadow:0 10px 24px -10px var(--c)}
.btn.ok{border-color:var(--g);color:var(--g)}.btn.warn{border-color:var(--r);color:var(--r)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--b);background:var(--bg);padding:8px 14px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.hd h2{margin:0}
.alert{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:14px;border-radius:14px;border:1px solid var(--b);border-left:4px solid var(--m);background:var(--p2)}
.alert.high{border-left-color:var(--r);background:linear-gradient(90deg,var(--rt),transparent 80%),var(--p2)}
.alert.fail{border-left-color:var(--a)}.alert.ok{border-left-color:var(--g)}
.ai{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--rt);color:var(--r)}
.alert.fail .ai{color:var(--a);background:rgba(251,191,36,.14)}.alert.ok .ai{color:var(--g);background:rgba(61,220,159,.14)}
.ai svg{width:24px;height:24px}
.alert h3{margin:6px 0 2px;font-size:1.1rem;line-height:1.25}
.kk{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.kk b{color:var(--r);font-size:.9rem}
.tag{border-radius:6px;padding:1px 8px;font-size:.74rem;font-weight:700;background:var(--p);border:1px solid var(--b)}
.quote{margin:10px 0 0;padding-left:12px;border-left:2px solid var(--b)}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.stack>*+*{margin-top:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tabs button[aria-selected="true"]{background:var(--t);color:var(--bg);border-color:transparent}
.avs{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 16px}
.avw{display:grid;justify-items:center;gap:2px;min-width:72px}
.av{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;font-weight:800;border:3px solid var(--b);background:var(--p2)}
.st{display:inline-block;font-weight:700;font-size:.85rem}
.st.safe{color:var(--g)}.st.needs{color:var(--r)}.st.pending,.st.noresp{color:var(--a)}
.members{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.mem{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--p2);border:1px solid var(--b)}
.mb{min-width:0;flex:1}.mb b{display:block}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts .btn{min-height:40px;padding:4px 10px;font-size:.84rem}
.meter{display:flex;gap:6px;margin:8px 0 12px}
.meter i{flex:1;height:8px;border-radius:4px;background:var(--p2);border:1px solid var(--b)}.meter i.on{background:var(--a)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.steps li{padding:10px 12px;border-radius:12px;background:var(--p2);border:1px solid var(--b)}
.steps li.p0{border-color:var(--r);background:var(--rt);font-weight:700}
.log{display:grid;gap:8px;max-height:520px;overflow:auto;margin:0;padding:0;list-style:none}
.log.s{max-height:none;flex:1;min-height:0}
.log li{border-left:3px solid var(--g);padding:5px 10px;background:var(--p2);border-radius:0 10px 10px 0;font-size:.9rem;word-break:break-word}
.log code{font:.8rem ui-monospace,Menlo,Consolas,monospace;color:var(--m)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--b)}
.tl li{position:relative;padding:0 0 12px 12px}
.tl li::before{content:"";position:absolute;left:-21px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--g);box-shadow:0 0 0 4px var(--p)}
.tt{display:block;font-size:.78rem;color:var(--m)}
pre.draft{white-space:pre-wrap;background:var(--bg);border:1px solid var(--b);border-radius:12px;padding:12px;margin:0 0 12px;font:inherit}
@media (max-width:900px){.home{grid-template-columns:1fr;height:auto}.two{grid-template-columns:1fr}.msgs{max-height:300px;flex:none}.grow{flex:none}.pin{display:none}.sct{max-width:none}.scrim{background:rgba(6,11,24,.62)}}
@media (max-width:760px){.app{grid-template-columns:1fr}nav{position:fixed;inset:auto 0 0 0;flex-direction:row;z-index:5;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--b);overflow-x:auto;background:var(--p)}nav button{flex:1;min-width:58px;min-height:52px}main{padding:10px 12px 84px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

.scene{flex:1 1 0;min-height:290px;height:auto}
.scene img.sc{object-fit:cover;object-position:70% 45%}
.sct h1{font-size:clamp(2rem,3.4vw,3.3rem);letter-spacing:-.035em}
.sct .ac{color:#ff6b6b}
.chatc{flex:none}.chatc .msgs{flex:none;min-height:60px;max-height:150px}
.msg.bot{display:flex;gap:12px;align-items:flex-start;background:none;max-width:100%;padding:4px 0;border-radius:0}
.bav{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--p2);border:1px solid var(--b);color:var(--c)}
.bav svg{width:24px;height:24px}
.field{flex:1;display:flex;align-items:center;gap:8px;min-width:0;border:1px solid var(--b);border-radius:14px;background:var(--bg);padding:0 8px 0 14px}
.field:focus-within{outline:3px solid var(--a)}
.field input{border:0;background:none;padding:8px 0;min-height:46px;outline:none;border-radius:0}
.field svg{width:20px;height:20px;color:var(--m)}
.mic{border:0;background:none;color:var(--m);display:grid;place-items:center;min-width:40px;min-height:40px;cursor:not-allowed}
.btn svg{width:20px;height:20px;margin-right:8px;vertical-align:-4px}
.btn.wide{width:100%;min-height:52px;font-size:1.05rem}
.hd svg.ic{width:20px;height:20px;margin-left:6px;vertical-align:-4px}
.alert{grid-template-columns:44px minmax(0,1fr) auto}
.wx{color:var(--r);opacity:.9}.wx svg{width:44px;height:44px}
.log{gap:0}
.log li{position:relative;padding:2px 0 16px 26px;margin-left:8px;border-left:2px solid rgba(61,220,159,.5);border-radius:0;background:none}
.log li::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--g);box-shadow:0 0 0 4px var(--p)}
.lh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.okb{margin-left:auto;border:1px solid var(--g);color:var(--g);border-radius:8px;padding:0 10px;font-size:.78rem;font-weight:700}
.log code{display:block;margin-top:6px;padding:8px 10px;background:var(--bg);border:1px solid var(--b);border-radius:10px}
.cb{min-height:44px!important;margin-bottom:6px}
.app.mini{grid-template-columns:64px minmax(0,1fr)}.app.mini nav button span{display:none}
@media (max-width:900px){.scene{flex:none;height:300px}}
@media (max-width:760px){.cb{display:none}}
</style>
</head>
<body>
<div class="app">
<nav aria-label="Main" id="nav"></nav>
<main>
<header class="top"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/><path d="M12 10v6M9 13h6"/></svg>R.I.S.E.</span><span class="badge sim">SIMULATED Alexa+ experience, not affiliated with Amazon</span><span class="badge" id="mode"></span><span class="sp"></span><span class="badge"><span class="dot"></span>Connected (prototype)</span></header>
<div class="stage" id="view"></div>
</main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const join=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const M=[{id:1,n:'Maria Rivera',pet:0,v:0,d:'Adult, independent'},{id:2,n:'Carlos Rivera',pet:0,v:0,d:'Adult, independent'},{id:3,n:'Elena Rivera',pet:0,v:1,d:'Senior, needs assistance. Uses a cane. Takes blood pressure medication.'},{id:4,n:'Leo Rivera',pet:0,v:1,d:'Child, dependent'},{id:5,n:'Buddy',pet:1,v:0,d:'Pet (golden retriever)'}];
const C=[{n:'Uncle Juan',ph:'555-0199'},{n:'Dr. Sarah Jenkins',ph:'555-0100'}];
const FL=[[1,'Elena Rivera','Start moving Elena Rivera early and arrange transport','Uses a cane, cannot walk long distances'],[2,'Leo Rivera','Keep an adult with Leo Rivera',''],[3,'','Head to the primary meeting point: Neighborhood Park',''],[4,'Uncle Juan','Call Uncle Juan first (priority 1)',''],[5,'Elena Rivera',"Gather Elena Rivera's medication and documents",'High blood pressure medication'],[6,'Buddy','Gather pet supplies and a carrier for Buddy',''],[7,'Buddy','Check that your shelter accepts pets','']];
const HT=[[4,'Elena Rivera','Check on Elena Rivera every few hours and keep them cool and hydrated',''],[4,'Leo Rivera','Check on Leo Rivera every few hours and keep them cool and hydrated',''],[5,'Buddy','Provide shade and water for Buddy','']];
const SC={
flood:{l:'Flood drill',mode:'SIMULATED',pre:'This is a simulated alert. ',hz:'Flood',sev:'warning',urg:'high',head:'SIMULATED: Major Flood Warning for Springfield Area',ins:'Evacuate immediately to higher ground. Do not drive through flooded roads.',area:'Springfield and surrounding valley',hl:'Flood warning and storm watch for The Rivera Family: 2 people need extra help getting out.',acts:FL},
heat:{l:'Heatwave drill',mode:'SIMULATED',pre:'This is a simulated alert. ',hz:'Heat',sev:'warning',urg:'high',head:'SIMULATED: Extreme Heat Warning',ins:'Stay indoors in air conditioning. Drink plenty of water. Check on vulnerable neighbors.',area:'Entire Metro Region',hl:'Heat warning for The Rivera Family: 2 people need extra care.',acts:HT},
rec:{l:'Recorded real alert',mode:'RECORDED',pre:'This is a replay of a past alert, not a live warning. ',hz:'Heat',sev:'warning',urg:'high',head:'Extreme Heat Warning issued October 3 at 12:15PM PDT until October 8 at 8:00PM PDT by NWS Los Angeles/Oxnard CA',ins:'Drink plenty of fluids, stay in an air-conditioned room, stay out of the sun, and check up on relatives and neighbors.',area:'Los Angeles area (real alert, replayed)',hl:'Heat warning for The Rivera Family: 2 people need extra care.',acts:HT},
none:{l:'No alerts',mode:'SIMULATED',pre:'This is a simulated alert. ',urg:'none',head:'',acts:[],hl:'No active alerts for The Rivera Family.'},
fail:{l:'Simulate alert failure',mode:'LIVE',fail:1,acts:[],urg:'none'}};
const ST={safe:['Safe','\u2713'],needs:['Needs help','!'],pending:['Pending','\u2026'],noresp:['Not responding','\u2013']};
let sc,active,skip,t0,st,logs,msgs;
function reset(){sc='flood';active=false;skip=0;t0=0;st={};logs=[];M.forEach(m=>st[m.id]={s:'pending',note:''});msgs=[{w:'bot',t:"I'm R.I.S.E., a simulated household emergency assistant. Ask what to do, or start a check-in. I never contact anyone."}];call('ping',{});render()}
function call(tool,args){logs.unshift({tool,args:JSON.stringify(args),t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})});logs.length=Math.min(logs.length,40)}
const el=()=>active?skip+Math.floor((Date.now()-t0)/60000):0;
function calc(){
 const e=el(),ppl=M.filter(m=>!m.pet),pets=M.filter(m=>m.pet),g=m=>st[m.id].s;
 const ord=a=>[...a].sort((x,y)=>(!x.v-!y.v)||x.n.localeCompare(y.n));
 const un=ord(ppl.filter(m=>g(m)==='pending'||g(m)==='noresp')),hp=ord(ppl.filter(m=>g(m)==='needs')),sf=ppl.filter(m=>g(m)==='safe'),np=pets.filter(m=>g(m)!=='safe'),all=M.every(m=>g(m)==='safe');
 const lvl=(un.length+hp.length)?(e<5?0:e<10?1:e<20?2:3):0,tg=join(ord([...un,...hp]).map(m=>m.n));
 const P=[],add=(p,w,a,r)=>P.push({p,w,a,r:r||''});
 if(hp.length){add(0,'','If anyone is in immediate danger, call your local emergency number');hp.forEach(m=>add(0,m.n,'Help '+m.n,st[m.id].note))}
 un.slice(0,6).forEach(m=>add(1,m.n,lvl?'Call '+m.n+' directly':'Check that '+m.n+' is safe'));
 if(un.length>6)add(1,'','Also check on '+(un.length-6)+' more: '+join(un.slice(6).map(m=>m.n)));
 if(lvl>=2)add(2,C[0].n,'Contact '+C[0].n+' and ask them to help check on '+tg,'Phone: '+C[0].ph);
 if(lvl>=3){add(3,C[1].n,'Contact '+C[1].n+' and ask them to help check on '+tg,'Phone: '+C[1].ph);add(3,'','If you believe anyone may be in danger, call your local emergency number')}
 if(np.length)add(5,'','Confirm where '+join(np.map(m=>m.n))+(np.length>1?' are':' is'));
 if(all)add(9,'','Everyone is confirmed safe. Close the check-in when you are ready.');
 P.sort((a,b)=>a.p-b.p);
 const sp=[];
 if(all)sp.push('Everyone is confirmed safe.');else{sp.push(sf.length+' of '+ppl.length+' people are confirmed safe.');
  if(hp.length)sp.push(join(hp.map(m=>m.n))+(hp.length>1?' need':' needs')+' help.');
  if(un.length)sp.push(join(un.map(m=>m.n))+(un.length>1?' have':' has')+' not responded.');
  if(np.length)sp.push(join(np.map(m=>m.n))+' not yet confirmed.')}
 const draft='R.I.S.E. check-in for The Rivera Family. Safe: '+(join(sf.map(m=>m.n))||'none')+'. Needs help: '+(join(hp.map(m=>m.n+(st[m.id].note?' ('+st[m.id].note.slice(0,60)+')':'')))||'none')+'. Not yet reached: '+(join(un.map(m=>m.n))||'none')+'.'+(un.length?' Please help check on '+join(un.map(m=>m.n))+'.':'');
 return{e,lvl,all,sp:sp.join(' '),P,draft,hp,un,sf,ppl}}
function advice(){const s=SC[sc];if(s.fail)return'We could not check for alerts. Do not assume there are none. Check your local weather service or authorities.';
 return s.acts.length?s.pre+s.hl+' Top actions: '+s.acts.slice(0,3).map(a=>a[2]).join('; ')+'.':s.pre+s.hl}
function bot(t){msgs.push({w:'bot',t})}
function start(){if(active)return bot('A check-in is already active for this household. Use get_checkin_status or close_checkin.');active=true;t0=Date.now();skip=0;M.forEach(m=>st[m.id]={s:'pending',note:''});call('start_checkin',{reason:'Simulated drill'});bot('Check-in started. Everyone is pending. Tell me who is safe, and I will only record what you tell me.')}
function rec(m,s,note){if(!active)return bot('No check-in is active. Use start_checkin to begin one.');st[m.id]={s,note:note||''};call('record_checkin',{member:m.n,status:{safe:'safe',needs:'needs_help',noresp:'not_responding',pending:'pending'}[s],note:note||undefined})}
function say(text){
 msgs.push({w:'me',t:text});const x=text.toLowerCase(),m=M.find(k=>new RegExp('\\b'+k.n.split(' ')[0].toLowerCase()+'\\b').test(x));
 if(m&&/needs help|hurt|fell|injured/.test(x)){if(!active)rec(m,'needs');else{rec(m,'needs',text.replace(/^.*?(needs help|hurt|fell|injured)[:,\-\s]*/i,'').slice(0,300));bot('Marked '+m.n+' as needing help. If anyone is in immediate danger, call your local emergency number. '+calc().sp)}}
 else if(m&&/not (answering|responding)|no answer|isn.?t answering/.test(x)){rec(m,'noresp');if(active)bot('Marked '+m.n+' as not responding. '+calc().sp)}
 else if(m&&/\bsafe\b|\bok(ay)?\b|\bfine\b/.test(x)){rec(m,'safe');if(active)bot('Marked '+m.n+' as safe. '+calc().sp)}

 '<div class="col"><div class="card"><div class="hd" style="margin-bottom:12px"><h2>Current situation</h2><button class="chip" data-go="alerts">View details'+svg(IC.arr)+'</button></div>'+alertH(s,1)+'</div><div class="card"><div class="hd" style="margin-bottom:10px"><h2>Family check-in</h2>'+svg(IC.ppl)+'</div>'+strip+'</div><div class="card grow"><div class="hd" style="margin-bottom:12px"><h2>MCP activity log</h2><button class="chip" data-go="log">View all'+svg(IC.arr)+'</button></div><ul class="log s">'+logH(5)+'</ul></div></div></div>'}

function board(s,c){
 if(!active)return'<div class="card"><h2>Family check-in</h2><p class="muted">No check-in is active. Start one to track who is safe.</p><button class="btn pri" data-q="Start a check-in">Start check-in</button></div>';

 '<div class="stack"><div class="card"><h2>Next steps</h2><ol class="steps">'+c.P.map(p=>'<li class="p'+p.p+'">'+esc(p.a)+(p.r?'<br><span class="muted">'+esc(p.r)+'</span>':'')+'</li>').join('')+'</ol></div><div class="card"><h2>Draft message</h2><pre class="draft" id="dr">'+esc(c.draft)+'</pre><div class="chips"><button class="btn" id="cp">Copy message</button><button class="btn pri" id="cl">Close check-in</button></div><p class="muted note">R.I.S.E. does not contact anyone. Use your phone to call or message.</p></div>'+tl()+'</div></div>'}

 '<div class="two"><div class="card"><h2>Priority actions</h2><ol class="steps">'+(s.acts.length?s.acts.map(a=>'<li><b>'+a[0]+'. '+esc(a[2])+'</b>'+(a[3]?'<br><span class="muted">'+esc(a[3])+'</span>':'')+'</li>').join(''):'<li class="muted">'+(s.fail?'Alerts could not be checked, so no advice is shown.':'No actions needed right now.')+'</li>')+'</ol></div><div class="card"><h2>From the alert</h2><p>'+esc(s.ins||'No official instructions.')+'</p><p class="muted note">Shown exactly as the alert gives it. This is general preparedness guidance from your saved household plan. Follow instructions from local authorities.</p></div></div>';

function more(s){
 return'<div class="two"><div class="card"><h2>Scenario controls</h2><div class="chips">'+Object.keys(SC).map(k=>'<button class="btn" data-sc="'+k+'" aria-pressed="'+(k===sc)+'"'+(k===sc?' style="border-color:var(--c)"':'')+'>'+SC[k].l+'</button>').join('')+'</div><div class="chips"><button class="btn" id="rst">Reset demo</button><button class="btn" id="big" aria-pressed="'+document.body.classList.contains('big')+'">Large text</button></div></div>'+
 '<div class="card"><h2>About R.I.S.E.</h2><p>Rapid Incident Safety and Escalation: a simulated household emergency copilot. This page imitates an assistant front end and is not affiliated with any assistant brand.</p><p class="muted">R.I.S.E. never contacts anyone. It records who you confirm is safe, shows who to contact next, and drafts a message you can copy. Advice is general preparedness guidance. Follow local authorities and call your local emergency number if anyone is in danger.</p></div></div>'}
function render(){
 const s=SC[sc],c=calc();
 $('#mode').textContent='Data: '+s.mode;
 $('#nav').innerHTML='<button id="col" class="cb" aria-label="Collapse or expand menu">'+svg(IC.arr)+'</button>'+NAV.map(n=>'<button data-go="'+n[0]+'"'+(n[0]===view?' aria-current="page"':'')+'>'+svg(IC[n[0]])+'<span>'+n[1]+'</span></button>').join('');
 const V={home,board,alerts,plan,log:logv,more};
 $('#view').innerHTML=V[view](s,c);
 const m=$('#msgs');if(m)m.scrollTop=1e6;
 const nv=$('#note');if(nv)nv.value=noteVal;pinPos()}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.go){view=d.go;render();$('#view').scrollTop=0}
 else if(d.at){atab=d.at;render()}
 else if(d.pt){ptab=d.pt;render()}
 else if(d.q){say(d.q)}
 else if(d.s){const[i,x]=d.s.split(':');setSt(+i,x)}
 else if(d.sc){sc=d.sc;call('server_restart',{alert_source:sc==='rec'?'nws_recorded':sc==='fail'?'nws':'fixture',scenario:sc});bot('Scenario changed to '+SC[sc].l+'. Prototype note: the real app restarts the MCP server here.');render()}
 else if(t.id==='col'){document.querySelector('.app').classList.toggle('mini')}
 else if(t.id==='skip'){skip+=5;render()}
 else if(t.id==='rst'){reset();noteVal='';view='home';render()}
 else if(t.id==='cl'){call('close_checkin',{});active=false;bot('Check-in closed.');view='home';render()}
 else if(t.id==='cp'){const x=$('#dr').textContent;(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>{t.textContent='Copied'},()=>{t.textContent='Select and copy the text above'})}
 else if(t.id==='big'){const on=document.body.classList.toggle('big');t.setAttribute('aria-pressed',on)}});
document.addEventListener('submit',e=>{if(e.target.id!=='form')return;e.preventDefault();const q=$('#q'),v=q.value.trim();if(v){q.value='';say(v.slice(0,200));const n=$('#q');if(n)n.focus()}});
document.addEventListener('input',e=>{if(e.target.id==='note')noteVal=e.target.value});
setInterval(()=>{if(active&&document.activeElement.tagName!=='INPUT')render()},30000);
window.addEventListener('resize',pinPos);
reset();
</script>
</body>
</html>
